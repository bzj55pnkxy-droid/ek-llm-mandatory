services:
  openhands:
    image: ${OPENHANDS_IMAGE:-docker.openhands.dev/openhands/openhands:1.8}
    build:
      context: ./openhands
      dockerfile: Dockerfile
      args:
        OPENHANDS_IMAGE: ${OPENHANDS_IMAGE:-docker.openhands.dev/openhands/openhands:1.8}
    container_name: openhands-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OPENHANDS_PORT:-8000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SANDBOX_HOST_PORT=${OPENHANDS_PORT:-8000}
      - OH_SANDBOX_HOST_PORT=${OPENHANDS_PORT:-8000}
      - OH_WEB_URL=http://host.docker.internal:${OPENHANDS_PORT:-8000}
      - SANDBOX_USER_ID=${SANDBOX_USER_ID:-0}
      - WORKSPACE_MOUNT_PATH=${WORKSPACE_DIR:-/opt/workspace_base}
      - WORKSPACE_BASE=/opt/workspace_base
      # V1 sandboxes only receive mounts listed here (comma-separated); WORKSPACE_MOUNT_PATH is ignored.
      # The chromium.d drop-in enables software WebGL for browser-tool screenshots.
      - SANDBOX_VOLUMES=${WORKSPACE_DIR:?set WORKSPACE_DIR to the absolute path of ./workspace}:/workspace/project:rw,${REPO_DIR:?set REPO_DIR to the absolute path of this repository}/openhands/sandbox/chromium.d/webgl-swiftshader:/etc/chromium.d/webgl-swiftshader:ro
      - FILE_STORE_PATH=/.openhands
      - AGENT_SERVER_IMAGE_REPOSITORY=${OPENHANDS_AGENT_SERVER_IMAGE:-ghcr.io/openhands/agent-server}
      - AGENT_SERVER_IMAGE_TAG=${OPENHANDS_AGENT_SERVER_TAG:-1.26.0-python}
      - SANDBOX_RUNTIME_CONTAINER_IMAGE=${OPENHANDS_AGENT_SERVER_IMAGE:-ghcr.io/openhands/agent-server}:${OPENHANDS_AGENT_SERVER_TAG:-1.26.0-python}
      - LLM_BASE_URL=${LLM_BASE_URL:-http://${OLLAMA_HOST:-host.docker.internal}:11434/v1}
      - OLLAMA_BASE_URL=${OLLAMA_DISCOVERY_URL:-http://${OLLAMA_HOST:-host.docker.internal}:11434}
      - OLLAMA_API_BASE=${OLLAMA_DISCOVERY_URL:-http://${OLLAMA_HOST:-host.docker.internal}:11434}
      - OPENAI_BASE_URL=${LLM_BASE_URL:-http://${OLLAMA_HOST:-host.docker.internal}:11434/v1}
      - OPENAI_API_BASE=${LLM_BASE_URL:-http://${OLLAMA_HOST:-host.docker.internal}:11434/v1}
      # OH_ENABLE_VNC overrides the sandbox default (0): starts the X desktop so the
      # browser tool runs headful, which is required for WebGL in screenshots.
      # OH_WEBHOOKS_0_EVENT_BUFFER_SIZE: with streaming every token is an event
      # (~33/s); the default batch of 5 floods the app with webhook posts. The GUI
      # streams live from the sandbox websocket, so batching only delays the app's
      # stored copy (flushed at 200 events or every 30s).
      - OH_AGENT_SERVER_ENV={"OH_ENABLE_VNC":"true","OH_WEBHOOKS_0_EVENT_BUFFER_SIZE":"200","OLLAMA_API_BASE":"${OLLAMA_DISCOVERY_URL:-http://${OLLAMA_HOST:-host.docker.internal}:11434}","OPENAI_API_BASE":"${LLM_BASE_URL:-http://${OLLAMA_HOST:-host.docker.internal}:11434/v1}","OPENAI_BASE_URL":"${LLM_BASE_URL:-http://${OLLAMA_HOST:-host.docker.internal}:11434/v1}"}
      # Default grace is 15s; starting the VNC desktop pushes agent-server startup
      # past it (~21s observed), and the app then marks the new sandbox as ERROR.
      - SANDBOX_STARTUP_GRACE_SECONDS=${SANDBOX_STARTUP_GRACE_SECONDS:-90}
      - SANDBOX_MEMORY=${SANDBOX_MEMORY:-4g}
      - SANDBOX_CPUS=${SANDBOX_CPUS:-2}
      - SANDBOX_PIDS_LIMIT=${SANDBOX_PIDS_LIMIT:-512}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./openhands/config:/.openhands
      - ./openhands/prompts:/.openhands/prompts:ro
      - ./openhands/agents:/root/.openhands/agents:ro
      - ./openhands/tools:/.openhands/tools:ro
      - ${WORKSPACE_DIR:-./workspace}:/opt/workspace_base
